name: Release

# Tag-driven release. Flow:
#
#   1. Bump the version in `pyproject.toml` on a release branch
#      (`poetry version X.Y.Z`) and roll CHANGELOG.md.
#   2. Merge that branch to main.
#   3. `git tag vX.Y.Z && git push origin vX.Y.Z` on the merge commit.
#
# Pushing the tag triggers this workflow:
#
#   build           -- builds sdist + wheel, asserts tag matches pyproject.
#   smoke-test      -- installs the built wheel (with the [testing] extra)
#                      into a clean venv and runs a tiny pytest that uses the
#                      shipped fixture — proves the `pytest11` entry point
#                      and the `sql_feature_store.testing` subpackage survive
#                      packaging before we publish.
#   publish-pypi    -- publishes to PyPI via Trusted Publishing
#                      (no API token; OIDC from the `pypi` GitHub environment,
#                      which can gate on manual approval).
#   github-release  -- creates the GitHub Release with the matching CHANGELOG
#                      section as the body, attaching the built artifacts.
#
# See CONTRIBUTING.md "Releasing" for the full per-release checklist.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry (official installer)
        env:
          POETRY_VERSION: "2.1.3"
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Cheap guard against "I tagged but forgot to bump pyproject.toml".
      # Tag must be vX.Y.Z and pyproject version must equal X.Y.Z.
      - name: Verify tag matches pyproject version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(poetry version -s)
          echo "Tag: $TAG  pyproject: $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match pyproject version $PKG"
            exit 1
          fi

      - name: Build sdist + wheel
        run: poetry build

      - name: Upload dist/
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke-test:
    name: Smoke-test built wheel
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download dist/
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Ensure postgres binary is on PATH (needed by pytest-postgresql)
        run: |
          PG_BIN=$(ls -d /usr/lib/postgresql/*/bin | sort | tail -n1)
          echo "$PG_BIN" >> "$GITHUB_PATH"
          "$PG_BIN/postgres" --version

      # Install the *built wheel* (not the source tree) into a throwaway venv,
      # with the `[testing]` extra. If the wheel is missing the pytest11 entry
      # point metadata or the `sql_feature_store.testing` subpackage, the
      # fixtures won't auto-discover and the test below will fail at collection
      # time — exactly what we want to catch before PyPI upload.
      - name: Install wheel[testing] into fresh venv
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install --upgrade pip
          WHEEL=$(ls dist/*.whl)
          echo "Installing $WHEEL with [testing] extra"
          /tmp/smoke-venv/bin/pip install "${WHEEL}[testing]"

      # Deliberately no conftest.py and no --plugins argument — the fixtures
      # must come from the pytest11 entry point alone. The test does a real
      # write + read round-trip so pytest-postgresql actually spins up.
      - name: Run smoke test against installed wheel
        run: |
          mkdir -p /tmp/smoke
          cat > /tmp/smoke/test_smoke.py <<'PY'
          """Smoke test for the built wheel — must run with no conftest."""

          import pandas as pd


          def test_pytest_plugin_round_trip(
              sql_feature_store_fixture, sql_feature_store_config
          ):
              store = sql_feature_store_fixture
              data = pd.DataFrame(
                  {"user_id": [1, 2], "username": ["alice", "bob"]}
              )

              store.write("users", data_frame=data, write_option="replace")

              got = store.read(
                  f"select * from {sql_feature_store_config.write_schema}.users "
                  "order by user_id"
              )
              assert got.equals(data)
          PY
          cd /tmp/smoke
          /tmp/smoke-venv/bin/pytest -q --no-header --maxfail=1 test_smoke.py

  publish-pypi:
    name: Publish to PyPI
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    # Protected GitHub environment holding the Trusted Publishing binding.
    # Configure required reviewers on this environment for a manual approval
    # gate on every release.
    environment:
      name: pypi
      url: https://pypi.org/project/sql-feature-store/
    permissions:
      id-token: write   # required for PyPI Trusted Publishing (OIDC)
    steps:
      - name: Download dist/
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download dist/
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Extract the CHANGELOG section for this version — the block between the
      # first `## [X.Y.Z]` header and the next `## [` header. Falls back to an
      # auto-generated note if no matching section is found (so a forgotten
      # CHANGELOG entry doesn't block the release).
      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE="$(mktemp)"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > "$NOTES_FILE"
          if [ ! -s "$NOTES_FILE" ]; then
            echo "No CHANGELOG section for [$VERSION] — using auto-notes."
            echo "autogenerate=true" >> "$GITHUB_OUTPUT"
          else
            echo "autogenerate=false" >> "$GITHUB_OUTPUT"
          fi
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.notes.outputs.autogenerate }}" = "true" ]; then
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "${GITHUB_REF_NAME}" \
              --notes-file "${{ steps.notes.outputs.notes_file }}"
          fi
