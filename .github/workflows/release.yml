name: Release

# Tag-driven release. Flow:
#
#   1. Bump the version in `pyproject.toml` on a release branch
#      (`poetry version X.Y.Z`) and roll CHANGELOG.md.
#   2. Merge that branch to main.
#   3. `git tag vX.Y.Z && git push origin vX.Y.Z` on the merge commit.
#
# Pushing the tag triggers this workflow:
#
#   build           -- builds sdist + wheel, asserts tag matches pyproject.
#   publish-pypi    -- publishes to PyPI via Trusted Publishing
#                      (no API token; OIDC from the `pypi` GitHub environment,
#                      which can gate on manual approval).
#   github-release  -- creates the GitHub Release with the matching CHANGELOG
#                      section as the body, attaching the built artifacts.
#
# See CONTRIBUTING.md "Releasing" for the full per-release checklist.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry (official installer)
        env:
          POETRY_VERSION: "2.1.3"
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Cheap guard against "I tagged but forgot to bump pyproject.toml".
      # Tag must be vX.Y.Z and pyproject version must equal X.Y.Z.
      - name: Verify tag matches pyproject version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(poetry version -s)
          echo "Tag: $TAG  pyproject: $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match pyproject version $PKG"
            exit 1
          fi

      - name: Build sdist + wheel
        run: poetry build

      - name: Upload dist/
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Protected GitHub environment holding the Trusted Publishing binding.
    # Configure required reviewers on this environment for a manual approval
    # gate on every release.
    environment:
      name: pypi
      url: https://pypi.org/project/sql-feature-store/
    permissions:
      id-token: write   # required for PyPI Trusted Publishing (OIDC)
    steps:
      - name: Download dist/
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download dist/
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Extract the CHANGELOG section for this version — the block between the
      # first `## [X.Y.Z]` header and the next `## [` header. Falls back to an
      # auto-generated note if no matching section is found (so a forgotten
      # CHANGELOG entry doesn't block the release).
      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE="$(mktemp)"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > "$NOTES_FILE"
          if [ ! -s "$NOTES_FILE" ]; then
            echo "No CHANGELOG section for [$VERSION] — using auto-notes."
            echo "autogenerate=true" >> "$GITHUB_OUTPUT"
          else
            echo "autogenerate=false" >> "$GITHUB_OUTPUT"
          fi
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.notes.outputs.autogenerate }}" = "true" ]; then
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "${GITHUB_REF_NAME}" \
              --notes-file "${{ steps.notes.outputs.notes_file }}"
          fi
