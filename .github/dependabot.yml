version: 2

updates:
  # Python dependencies (Poetry-managed via pyproject.toml).
  # Split into two grouped PRs per week: one for runtime deps (higher-risk,
  # reviewed more carefully) and one for dev deps (lint/test tooling).
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "deps"
      include: scope
    groups:
      python-runtime:
        dependency-type: production
        patterns:
          - "*"
      python-dev:
        dependency-type: development
        patterns:
          - "*"

  # GitHub Actions used by workflows under .github/workflows/.
  # Grouped into a single weekly PR.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      actions:
        patterns:
          - "*"
