[project]
name = "sql-feature-store"
version = "0.1.0"
description = "Lightweight online feature store backed by a SQL database (currently PostgreSQL) with a pandas API: automatic table creation, column migration, upserts, and chunked reads."
authors = [
    {name = "Mark Jad", email = "mark.jad@live.com"}
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.14"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "SQLAlchemy>=2.0.7",
    "psycopg2-binary>=2.9.6",
]

[tool.poetry]
packages = [{include = "sql_feature_store", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = "^7.2.2"
pytest-mock = "^3.10.0"
pytest-postgresql = "^6.0.1"
pytest-cov = "^5.0.0"
psycopg = "^3.1.8"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
