[tox]
envlist = dev
skipsdist = True

[testenv]
# We defer all installing to Poetry so the tox-managed venv doesn't fight the
# Poetry-managed one. `commands_pre` syncs project + dev deps, and
# `commands` runs the full local-verification sequence.
#
# `VIRTUAL_ENV=` is cleared because Poetry respects that variable when set
# and would otherwise install everything into tox's `.tox/dev/` venv instead
# of its own cache. On macOS that secondary venv also trips Gatekeeper on
# unsigned extension modules (numpy, psycopg2).
skip_install = True
allowlist_externals = poetry
setenv =
    VIRTUAL_ENV=
commands_pre =
    poetry install
commands =
    # `coverage run -m pytest` (instead of `pytest --cov=...`) starts
    # coverage before pytest loads its entry-point plugins. That matters
    # here because we ship our own `pytest11` plugin in
    # `sql_feature_store.testing.plugin`; with plain pytest-cov the package
    # is already imported by the time coverage activates, so `__init__.py`
    # and `config.py` report 0% even though they're executed.
    poetry run coverage run -m pytest .
    poetry run coverage report
    poetry run pre-commit run --all-files
    poetry run mypy src

[flake8]
# Set max-line-length to black compatible 88
max-line-length = 88
# Ignore flake8 warnings E203 and W503 that conflict with black formatting.
extend-ignore = E203, W503

[isort]
profile = black

[mypy]
python_version = 3.10
files = src
check_untyped_defs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
warn_unreachable = True
no_implicit_optional = True
strict_equality = True

# Third-party libs without complete stubs: keep them from blocking adoption.
[mypy-pandas.io.sql]
ignore_missing_imports = True

[mypy-sqlalchemy.*]
ignore_missing_imports = True

[coverage:run]
source = sql_feature_store

[coverage:report]
show_missing = True
precision = 2
# Target coverage floor. Remove this line to never fail for coverage.
fail_under = 90
